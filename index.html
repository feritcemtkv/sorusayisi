<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Soru Takip Defteri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
  import { GoogleGenAI } from 'https://cdn.jsdelivr.net/npm/@google/genai/+esm';
  window.GoogleGenAI = GoogleGenAI;
</script>
<style>
  :root{
    --paper:#FAFAF6;
    --grid:#DCE4EC;
    --grid-soft:#E8EDF2;
    --ink:#1F2933;
    --ink-soft:#68727C;
    --ink-faint:#9AA3AC;
    --red:#C0392B;
    --red-soft:#E8CFC9;
    --green:#2F6F4F;
    --green-soft:#DCEAE2;
    --gold:#C6941C;
    --gold-soft:#F1E3BE;
    --line:#D7DEE5;
    --card:#FFFFFF;
    --radius:14px;
    --shadow:0 1px 2px rgba(31,41,51,.04), 0 8px 24px -12px rgba(31,41,51,.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--paper);
    background-image:
      linear-gradient(var(--grid-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-soft) 1px, transparent 1px);
    background-size:26px 26px;
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding:28px 16px 64px;
  }
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;letter-spacing:-0.01em;}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  a{color:inherit;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:4px;}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}

  .shell{max-width:560px;margin:0 auto;position:relative;}
  .shell.wide{max-width:820px;}
  .margin-rule{
    position:absolute;left:-18px;top:0;bottom:0;width:2px;background:var(--red-soft);
    display:none;
  }
  @media (min-width:640px){ .margin-rule{display:block;} }

  .eyebrow{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px;display:flex;align-items:center;gap:8px;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--red);}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:22px;
  }
  .holes{display:flex;gap:10px;padding:0 4px 10px;}
  .holes span{width:8px;height:8px;border-radius:50%;background:var(--paper);border:1.5px solid var(--line);}

  .back-link{
    display:inline-flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;
    color:var(--ink-soft);font-size:13px;font-weight:600;padding:6px 0;margin-bottom:14px;
  }
  .back-link:hover{color:var(--red);}
  .back-link svg{width:14px;height:14px;}

  .top-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;}

  .hero{padding:34px 6px 26px;text-align:left;animation:rise .5s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .hero h1{font-size:clamp(28px,6vw,38px);line-height:1.12;font-style:italic;}
  .hero p{color:var(--ink-soft);margin-top:10px;font-size:15px;max-width:40ch;}

  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px;}
  @media (max-width:480px){.role-grid{grid-template-columns:1fr;}}
  .role-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px 18px;text-align:left;cursor:pointer;box-shadow:var(--shadow);
    transition:transform .15s ease, border-color .15s ease;
  }
  .role-card:hover{transform:translateY(-2px);border-color:var(--ink-faint);}
  .role-card .icon{width:30px;height:30px;color:var(--red);margin-bottom:12px;}
  .role-card h3{font-size:19px;margin-bottom:4px;}
  .role-card p{font-size:13px;color:var(--ink-soft);margin:0;line-height:1.5;}

  .stat-strip{display:flex;gap:14px;margin-top:24px;flex-wrap:wrap;}
  .stat-pill{
    background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:120px;
  }
  .stat-pill .num{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;}
  .stat-pill .label{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border-radius:10px;padding:12px 18px;font-size:14px;font-weight:600;cursor:pointer;
    border:1px solid transparent;transition:opacity .15s ease, transform .1s ease;
  }
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:hover{opacity:.88;}
  .btn-red{background:var(--red);color:#fff;}
  .btn-red:hover{opacity:.9;}
  .btn-outline{background:transparent;border-color:var(--line);color:var(--ink);}
  .btn-outline:hover{border-color:var(--ink-faint);}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}

  .badge{
    display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
    padding:3px 9px;border-radius:100px;text-transform:uppercase;letter-spacing:.04em;
  }
  .badge-lgs{background:var(--green-soft);color:var(--green);}
  .badge-yks{background:var(--gold-soft);color:var(--gold);}

  .list-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;
  }
  .list-row:last-child{border-bottom:none;}
  .list-row:hover{background:var(--grid-soft);}
  .list-row .name{font-weight:600;font-size:15px;}
  .list-row .meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .list-row .right{display:flex;align-items:center;gap:16px;}
  .list-row .figure{text-align:right;}
  .list-row .figure .n{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;}
  .list-row .figure .l{font-size:10px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
  .field input[type=text], .field input[type=password], .field input[type=number]{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;
    font-size:15px;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);
  }
  .field input:focus{border-color:var(--ink);}

  .choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .choice{
    border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer;
    font-size:13.5px;font-weight:600;text-align:center;background:var(--paper);
  }
  .choice.active{border-color:var(--red);background:var(--red-soft);color:var(--red);}

  .subject-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 2px;border-bottom:1px dashed var(--line);
  }
  .subject-row:last-of-type{border-bottom:none;}
  .subject-row .sname{font-size:14.5px;font-weight:500;}
  .subject-row .chip{font-size:10px;color:var(--ink-faint);font-family:'IBM Plex Mono',monospace;margin-left:6px;}
  .num-input{
    width:74px;text-align:center;padding:9px 6px;border:1.5px solid var(--line);border-radius:8px;
    font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;color:var(--ink);
    background:var(--paper);
  }
  .num-input:focus{border-color:var(--red);}

  .total-box{
    margin-top:18px;padding:16px 18px;border-radius:12px;background:var(--ink);color:#fff;
    display:flex;align-items:center;justify-content:space-between;
  }
  .total-box .label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.7;}
  .total-box .num{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:600;border-bottom:2px solid var(--red);padding-bottom:2px;}

  .save-note{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--green);font-weight:600;margin-top:12px;height:18px;}
  .save-note svg{width:15px;height:15px;}

  .section-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin:26px 0 12px;}

  .streak{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--gold);}

  .empty{padding:30px 10px;text-align:center;color:var(--ink-soft);}
  .empty p{font-size:14px;margin:10px 0 18px;}

  .chart-wrap{position:relative;height:170px;margin-top:6px;}
  .chart-wrap.tall{height:220px;}

  table.entries{width:100%;border-collapse:collapse;font-size:13px;}
  table.entries th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);padding:8px 6px;border-bottom:1px solid var(--line);}
  table.entries td{padding:9px 6px;border-bottom:1px solid var(--grid-soft);}
  table.entries td.n{font-family:'IBM Plex Mono',monospace;font-weight:600;}

  .footer-note{text-align:center;font-size:11.5px;color:var(--ink-faint);margin-top:30px;}

  .secret-dot{width:44px;height:44px;display:flex;align-items:center;justify-content:center;margin:6px auto 0;}
  .secret-dot span{width:6px;height:6px;border-radius:50%;background:var(--grid);}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------------- constants ---------------- */
const LGS_SUBJECTS = ['Türkçe','Matematik','Fen Bilimleri','İngilizce','Din Kültürü'];
const TYT_SUBJECTS = ['Türkçe (TYT)','Matematik (TYT)','Fen Bilimleri (TYT)','Sosyal Bilimler (TYT)'];
const AYT_SUBJECTS = {
  sayisal: ['Matematik (AYT)','Fizik','Kimya','Biyoloji'],
  esit_agirlik: ['Matematik (AYT)','Edebiyat','Tarih-1','Coğrafya-1'],
  sozel: ['Edebiyat','Tarih-1','Coğrafya-1','Tarih-2','Coğrafya-2','Felsefe Grubu','Din Kültürü'],
  dil: ['Yabancı Dil Testi']
};
const ALAN_LABELS = {sayisal:'Sayısal', esit_agirlik:'Eşit Ağırlık', sozel:'Sözel', dil:'Dil'};
const MONTHS = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const PALETTE = ['#C0392B','#2F6F4F','#C6941C','#68727C','#8B5E9B','#2E6B8F','#B0563E','#4E7D3B'];
// Öğretmen PIN kodu — istersen bunu değiştir (sadece rakam/karakter olabilir)
const TEACHER_PIN = '2026';
const REMEMBER_KEY = 'soru_takip_student_id';
function getRemembered(){ try{ return localStorage.getItem(REMEMBER_KEY); } catch(e){ return null; } }
function setRemembered(id){ try{ localStorage.setItem(REMEMBER_KEY, id); } catch(e){} }
function clearRemembered(){ try{ localStorage.removeItem(REMEMBER_KEY); } catch(e){} }
function generatePassword(){ return String(Math.floor(1000 + Math.random()*9000)); }
function suggestUsername(name){
  const map = {'ç':'c','ğ':'g','ı':'i','ö':'o','ş':'s','ü':'u'};
  let s = (name||'').toLowerCase().split('').map(ch=>map[ch]||ch).join('');
  s = s.replace(/[^a-z0-9]+/g,'');
  return s || 'ogrenci';
}
const MOTIVATIONAL_QUOTES = [
  { text:'Hayatta en hakiki mürşit ilimdir.', author:'Mustafa Kemal Atatürk' },
  { text:'Deha, yüzde bir ilham, yüzde doksan dokuz terdir.', author:'Thomas Edison' },
  { text:'Ne kadar yavaş gittiğinin önemi yok, yeter ki durma.', author:'Konfüçyüs' },
  { text:'Bizler, tekrar tekrar yaptığımız şeylerin toplamıyız. Mükemmellik bir eylem değil, bir alışkanlıktır.', author:'Aristoteles' },
  { text:'Her şey bitene kadar imkansız görünür.', author:'Nelson Mandela' },
  { text:'Ne kadar çok çalışırsam, o kadar çok şansım oluyor.', author:'Thomas Jefferson' },
  { text:'Başarı, şevkini kaybetmeden başarısızlıktan başarısızlığa gidebilme yeteneğidir.', author:'Winston Churchill' },
  { text:'Hayatta korkulacak hiçbir şey yok, yalnızca anlaşılması gereken şeyler var.', author:'Marie Curie' },
  { text:'Bilgiye yapılan yatırım, her zaman en iyi kazancı getirir.', author:'Benjamin Franklin' },
  { text:'Yarın ölecekmiş gibi yaşa, hiç ölmeyecekmiş gibi öğren.', author:'Mahatma Gandhi' },
  { text:'Öğrenmeyi bırakan kişi yaşlıdır, ister yirmisinde ister seksininde olsun.', author:'Henry Ford' },
  { text:'Başarı bir yolculuktur, varış noktası değil.', author:'Arthur Ashe' },
];

// Gemini API — günlük hedefe göre kısa değerlendirme yazar
const GEMINI_API_KEY = 'AQ.Ab8RN6KfN2hue8rYIAKGKhcMhJpaPc43AaBA5lTH7uGBX_GIzQ';
const GEMINI_MODEL = 'gemini-3.6-flash';
let _geminiClient = null;
function getGeminiClient(){
  if(!window.GoogleGenAI){ return null; }
  if(!_geminiClient){ _geminiClient = new window.GoogleGenAI({ apiKey: GEMINI_API_KEY }); }
  return _geminiClient;
}
async function callGemini(prompt){
  try{
    const ai = getGeminiClient();
    if(!ai){ console.error('Gemini SDK henüz yüklenmedi'); return null; }
    const response = await ai.models.generateContent({ model: GEMINI_MODEL, contents: prompt });
    const text = response && response.text;
    return text ? text.trim() : null;
  } catch(e){
    console.error('Gemini hatası', e);
    return null;
  }
}

async function getGeminiVerdict(studentName, target, actual){
  const prompt = `Sen bir özel ders öğretmeninin öğrencisine yazdığı kısa, samimi bir Türkçe geri bildirim asistanısın. Öğrencinin adı: ${studentName}. Bugünkü hedefi: ${target} soru. Bugün çözdüğü: ${actual} soru. Bu bilgiye göre, öğrenciye doğrudan hitap eden, 1-2 cümlelik, samimi ve motive edici bir Türkçe değerlendirme yaz. Sadece değerlendirme metnini yaz; başlık, tırnak işareti veya ek açıklama ekleme.`;
  return await callGemini(prompt);
}

async function getGeminiTarget(student){
  const recentAvg = Math.round(sumForRange(student.id,7)/7);
  const allTime = sumAllTime(student.id);
  const streak = calcStreak(student.id);
  const hasHistory = entriesFor(student.id).length>0;
  const examLabel = student.type==='LGS' ? 'LGS' : `YKS (${ALAN_LABELS[student.alan]} alanı)`;
  const prompt = hasHistory
    ? `Sen bir özel ders öğretmeninin, öğrencisi için günlük soru çözme hedefi belirlemesine yardım eden bir asistansın. Öğrenci: ${student.name}, ${examLabel} sınavına hazırlanıyor. Son 7 günün günlük ortalaması: ${recentAvg} soru. Bugüne kadar toplam çözdüğü: ${allTime} soru. Şu anki art arda gün serisi: ${streak}. Bu bilgilere göre, öğrenciyi hem hafifçe zorlayan hem gerçekçi bir günlük soru çözme hedefi öner. Sadece şu formatta cevap ver, başka hiçbir şey ekleme:\nHEDEF: <sadece sayı>\nSEBEP: <tek cümlelik kısa Türkçe açıklama>`
    : `Sen bir özel ders öğretmeninin, yeni bir öğrencisi için başlangıç günlük soru çözme hedefi belirlemesine yardım eden bir asistansın. Öğrenci: ${student.name}, ${examLabel} sınavına hazırlanıyor, henüz hiç veri girmemiş. Yeni başlayan bir öğrenci için makul bir başlangıç günlük hedefi öner. Sadece şu formatta cevap ver, başka hiçbir şey ekleme:\nHEDEF: <sadece sayı>\nSEBEP: <tek cümlelik kısa Türkçe açıklama>`;
  const text = await callGemini(prompt);
  if(!text) return null;
  const numMatch = text.match(/HEDEF:\s*(\d+)/i);
  const reasonMatch = text.match(/SEBEP:\s*(.+)/i);
  const target = numMatch ? parseInt(numMatch[1]) : null;
  const reason = reasonMatch ? reasonMatch[1].trim() : '';
  return (target && target>0) ? { target, reason } : null;
}

function getSubjects(student){
  if(!student) return [];
  if(student.type==='LGS') return LGS_SUBJECTS.slice();
  return TYT_SUBJECTS.concat(AYT_SUBJECTS[student.alan]||[]);
}

/* ---------------- state ---------------- */
const state = {
  loading:true,
  loadError:false,
  students:[],
  entries:[],
  view:'login',
  currentStudentId:null,
  teacherStudentId:null,
  createdStudent:null,
  justSaved:false,
  motivationalQuote:null,
  geminiVerdict:null,
  geminiLoading:false,
  targetLoadingFor:null,
  targetAutoTried:null,
};
const charts = {};

/* ---------------- utils ---------------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function fmtDate(d){ const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function todayStr(){ return fmtDate(new Date()); }
function addDays(dateStr, n){ const [y,m,d]=dateStr.split('-').map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return fmtDate(dt); }
function shortLabel(dateStr){ const [y,m,d]=dateStr.split('-').map(Number); return `${d} ${MONTHS[m-1]}`; }
function longLabel(dateStr){ const [y,m,d]=dateStr.split('-').map(Number); return `${d} ${MONTHS[m-1]} ${y}`; }
function rangeDates(endStr, n){ const arr=[]; for(let i=n-1;i>=0;i--) arr.push(addDays(endStr,-i)); return arr; }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function entriesFor(studentId){ return state.entries.filter(e=>e.studentId===studentId); }
function totalOf(entry){ return Object.values(entry.subjects||{}).reduce((a,b)=>a+(Number(b)||0),0); }
function sumForDate(studentId, dateStr){ const e = entriesFor(studentId).find(e=>e.date===dateStr); return e? totalOf(e):0; }
function sumForRange(studentId, days){ const end=todayStr(); return rangeDates(end,days).reduce((s,d)=>s+sumForDate(studentId,d),0); }
function sumAllTime(studentId){ return entriesFor(studentId).reduce((s,e)=>s+totalOf(e),0); }
function calcStreak(studentId){
  const withData = new Set(entriesFor(studentId).filter(e=>totalOf(e)>0).map(e=>e.date));
  let streak=0, cur=todayStr();
  if(!withData.has(cur)) cur = addDays(cur,-1);
  while(withData.has(cur)){ streak++; cur=addDays(cur,-1); }
  return streak;
}
function subjectTotals(studentId){
  const totals = {};
  entriesFor(studentId).forEach(e=>{
    Object.entries(e.subjects||{}).forEach(([k,v])=>{ totals[k]=(totals[k]||0)+(Number(v)||0); });
  });
  return totals;
}
function subjectTotalsRange(studentId, startStr, endStr){
  const totals = {};
  entriesFor(studentId).forEach(e=>{
    if(e.date>=startStr && e.date<=endStr){
      Object.entries(e.subjects||{}).forEach(([k,v])=>{ totals[k]=(totals[k]||0)+(Number(v)||0); });
    }
  });
  return totals;
}
function subjectBreakdown(student, rangeStart, rangeEnd){
  const subjects = getSubjects(student);
  const weekTotals = subjectTotalsRange(student.id, rangeStart, rangeEnd);
  const allTotals = subjectTotals(student.id);
  return subjects.map(s=>({
    subject: s,
    group: s.includes('(AYT)') ? 'AYT' : (s.includes('(TYT)') ? 'TYT' : ''),
    week: weekTotals[s]||0,
    all: allTotals[s]||0,
  }));
}
function startOfWeekMonday(dateStr){
  const [y,m,d]=dateStr.split('-').map(Number);
  const dt=new Date(y,m-1,d);
  const day=dt.getDay();
  const diff = day===0 ? -6 : 1-day;
  dt.setDate(dt.getDate()+diff);
  return fmtDate(dt);
}
function firstOfMonth(dateStr){ const [y,m]=dateStr.split('-').map(Number); return `${y}-${String(m).padStart(2,'0')}-01`; }
function shiftMonthFirst(firstDateStr, n){ const [y,m]=firstDateStr.split('-').map(Number); const dt=new Date(y,m-1+n,1); return fmtDate(dt); }
function sumRangeInclusive(studentId, startStr, endStr){
  if(startStr>endStr) return 0;
  let s=startStr, sum=0, guard=0;
  while(s<=endStr && guard<400){ sum+=sumForDate(studentId,s); s=addDays(s,1); guard++; }
  return sum;
}
function periodStats(studentId){
  const today = todayStr();
  const thisWeekStart = startOfWeekMonday(today);
  const lastWeekEnd = addDays(thisWeekStart,-1);
  const lastWeekStart = addDays(thisWeekStart,-7);
  const thisMonthStart = firstOfMonth(today);
  const lastMonthStart = shiftMonthFirst(thisMonthStart,-1);
  const lastMonthEnd = addDays(thisMonthStart,-1);
  return {
    today: sumForDate(studentId, today),
    thisWeek: sumRangeInclusive(studentId, thisWeekStart, today),
    lastWeek: sumRangeInclusive(studentId, lastWeekStart, lastWeekEnd),
    thisMonth: sumRangeInclusive(studentId, thisMonthStart, today),
    lastMonth: sumRangeInclusive(studentId, lastMonthStart, lastMonthEnd),
    allTime: sumAllTime(studentId),
  };
}

async function withLatestData(mutator){
  try{
    const { data, error } = await _supabase.from('soru_takip').select('data').eq('id', 1).maybeSingle();
    if(error) throw error;
    const payload = (data && data.data) ? data.data : { students:[], entries:[] };

      .upsert({ id: 1, data: { students, entries } }, { onConflict: 'id' });

  const weekTotal = state.students.reduce((s,st)=>s+sumForRange(st.id,7),0);

  html += `<button class="back-link" id="back">${ICONS.back}Ana Sayfa</button>`;
  html += `<div class="top-row"><h2 style="font-size:24px;">Öğretmen Paneli</h2>
    <button class="btn btn-outline" id="add-student">+ Öğrenci Ekle</button></div>`;

  html += `<div class="stat-strip">
    <div class="stat-pill"><span class="num mono">${todayTotal}</span><span class="label">Bugün</span></div>
    <div class="stat-pill"><span class="num mono">${weekTotal}</span><span class="label">Bu Hafta</span></div>
    <div class="stat-pill"><span class="num mono">${state.students.length}</span><span class="label">Öğrenci</span></div>
  </div>`;

  html += `<div class="section-title">Öğrenciler</div><div class="card">`;
  if(state.students.length===0){
    html += `<div class="empty"><p>Henüz öğrenci eklenmedi.</p></div>`;
  } else {
    state.students.slice().sort((a,b)=> sumForDate(b.id,todayStr()) - sumForDate(a.id,todayStr())).forEach(st=>{
      const badge = st.type==='LGS' ? `<span class="badge badge-lgs">LGS</span>` : `<span class="badge badge-yks">YKS · ${ALAN_LABELS[st.alan]}</span>`;
      const streak = calcStreak(st.id);
      html += `<div class="list-row" data-id="${st.id}">
        <div><div class="name">${escapeHtml(st.name)} ${streak>=2?`<span class="streak" style="margin-left:6px;">${ICONS.flame}${streak}</span>`:''}</div><div class="meta">${badge} ${st.username && st.password ? `<span class="mono">@${escapeHtml(st.username)} · ${escapeHtml(st.password)}</span>` : `<span style="color:var(--red);font-weight:700;">Giriş bilgisi eksik — düzenle</span>`}</div></div>
        <div class="right">
          <div class="figure"><div class="n">${sumForDate(st.id,todayStr())}</div><div class="l">Bugün</div></div>
          <div class="figure"><div class="n">${sumForRange(st.id,7)}</div><div class="l">Hafta</div></div>
        </div>
      </div>`;
    });
  }
  html += `</div>`;
  html += shellClose();
  document.getElementById('app').innerHTML = html;
  document.getElementById('back').onclick = ()=>{ state.view='login'; render(); };
  document.getElementById('add-student').onclick = ()=>{ state.view='student-add'; render(); };
  document.querySelectorAll('.list-row[data-id]').forEach(row=>{
    row.onclick = ()=>{ state.teacherStudentId = row.getAttribute('data-id'); state.view='teacher-detail'; render(); };
  });
}

/* ---------------- TEACHER DETAIL ---------------- */
function renderTeacherDetail(){
  const student = state.students.find(s=>s.id===state.teacherStudentId);
  if(!student){ state.view='teacher-list'; return render(); }
  const badge = student.type==='LGS' ? `<span class="badge badge-lgs">LGS</span>` : `<span class="badge badge-yks">YKS · ${ALAN_LABELS[student.alan]}</span>`;
  const streak = calcStreak(student.id);
  const rows = entriesFor(student.id).slice().sort((a,b)=> b.date.localeCompare(a.date)).slice(0,14);

  const needsAutoFetch = !student.dailyTarget && state.targetLoadingFor!==student.id && state.targetAutoTried!==student.id;
  const targetLoading = state.targetLoadingFor===student.id || needsAutoFetch;
  if(needsAutoFetch){
    state.targetAutoTried = student.id;
    state.targetLoadingFor = student.id;
  }

  let html = shellOpen({wide:true});
  html += `<button class="back-link" id="back">${ICONS.back}Tüm Öğrenciler</button>`;
  html += `<div class="top-row"><div><h2 style="font-size:24px;">${escapeHtml(student.name)}</h2><div style="margin-top:6px;">${badge}</div></div>
    ${streak>=2 ? `<div class="streak">${ICONS.flame}${streak} gün üst üste</div>`:''}</div>`;

  html += `<div class="card" style="margin-bottom:20px;">
    <label style="display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em;">Giriş Bilgileri</label>
    <div id="pw-card-body">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
        <div>
          <div class="num mono" style="font-size:16px;">@${escapeHtml(student.username || 'belirlenmedi')}</div>
          <div class="num mono" style="font-size:18px;margin-top:2px;">${escapeHtml(student.password || 'şifre yok')}</div>
        </div>
        <button class="btn btn-outline" id="change-pw" style="padding:8px 14px;font-size:13px;">Değiştir</button>
      </div>
    </div>
  </div>`;

  html += `<div class="card" style="margin-bottom:20px;">
    <label style="display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em;">Günlük Hedef <span style="font-weight:400;text-transform:none;color:var(--ink-faint);">— Gemini belirler</span></label>
    <div id="target-card-body">`;
  if(targetLoading){
    html += `<div style="font-size:13px;color:var(--ink-soft);">Gemini hedef belirliyor…</div>`;
  } else {
    html += `<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
        <div>
          <span class="num mono" style="font-size:18px;">${student.dailyTarget ? student.dailyTarget + ' soru' : 'Henüz belirlenmedi'}</span>
          ${student.targetReason ? `<div style="font-size:11.5px;color:var(--ink-soft);margin-top:3px;">${escapeHtml(student.targetReason)}</div>` : ''}
        </div>
        <button class="btn btn-outline" id="refresh-target" style="padding:8px 14px;font-size:13px;white-space:nowrap;">Gemini'den ${student.dailyTarget ? 'Yenile' : 'Belirle'}</button>
      </div>`;
  }
  html += `</div></div>`;

  const todayBreakdown = getSubjects(student).map(s=>({
    subject: s,
    group: s.includes('(AYT)') ? 'AYT' : (s.includes('(TYT)') ? 'TYT' : ''),
    count: (subjectTotalsRange(student.id, todayStr(), todayStr())[s]) || 0,
  }));
  const todayTotal = todayBreakdown.reduce((a,b)=>a+b.count,0);
  html += `<div class="section-title">Bugün Derslere Göre</div>
  <div class="card" style="margin-bottom:20px;">`;
  if(todayTotal===0){
    html += `<div class="empty"><p>Bugün henüz soru girilmemiş.</p></div>`;
  } else {
    todayBreakdown.filter(b=>b.count>0).forEach(b=>{
      const name = b.subject.replace(' (TYT)','').replace(' (AYT)','');
      html += `<div class="subject-row"><span class="sname">${escapeHtml(name)}${b.group?`<span class="chip">${b.group}</span>`:''}</span><span class="num mono">${b.count}</span></div>`;
    });
  }
  html += `</div>`;

  const dstats = periodStats(student.id);
  html += `<div class="stat-strip">
    <div class="stat-pill"><span class="num mono">${dstats.today}</span><span class="label">Bugün</span></div>
    <div class="stat-pill"><span class="num mono">${dstats.thisWeek}</span><span class="label">Bu Hafta</span></div>
    <div class="stat-pill"><span class="num mono">${dstats.lastWeek}</span><span class="label">Geçen Hafta</span></div>
    <div class="stat-pill"><span class="num mono">${dstats.thisMonth}</span><span class="label">Bu Ay</span></div>
    <div class="stat-pill"><span class="num mono">${dstats.lastMonth}</span><span class="label">Geçen Ay</span></div>
    <div class="stat-pill"><span class="num mono">${dstats.allTime}</span><span class="label">Tüm Zamanlar</span></div>
  </div>`;

  const trendDays = trendRange(student.id);
  const trendTitle = trendDays.length<30 ? 'İlk Günden Bugüne' : 'Son 30 Gün';
  html += `<div class="section-title">${trendTitle}</div>
  <div class="card"><div class="chart-wrap tall"><canvas id="chart-trend"></canvas></div></div>`;

  const hasEntries = entriesFor(student.id).length>0;
  const weekStart = startOfWeekMonday(todayStr());
  const breakdown = subjectBreakdown(student, weekStart, todayStr());
  const breakdownTotal = breakdown.reduce((s,b)=>s+b.all,0);
  html += `<div class="section-title">Derslere Göre Dağılım</div>
  <div class="card">`;
  if(!hasEntries){
    html += `<div class="empty"><p>Henüz ders bazlı veri yok.</p></div>`;
  } else {
    html += `<div class="chart-wrap" style="height:${Math.max(200, breakdown.length*34)}px;"><canvas id="chart-subjects"></canvas></div>
    <table class="entries" style="margin-top:20px;">
      <thead><tr><th>Ders</th><th style="text-align:right;">Bu Hafta</th><th style="text-align:right;">Toplam</th><th style="text-align:right;">%</th></tr></thead>
      <tbody>`;
    breakdown.forEach(b=>{
      const name = b.subject.replace(' (TYT)','').replace(' (AYT)','');
      const pct = breakdownTotal>0 ? Math.round(b.all/breakdownTotal*100) : 0;
      html += `<tr><td>${escapeHtml(name)}${b.group?` <span class="chip">${b.group}</span>`:''}</td><td class="n" style="text-align:right;">${b.week}</td><td class="n" style="text-align:right;">${b.all}</td><td class="n" style="text-align:right;color:var(--ink-soft);">%${pct}</td></tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `</div>`;

  html += `<div class="section-title">Son Girişler</div>
  <div class="card">`;
  if(rows.length===0){
    html += `<div class="empty"><p>Henüz kayıt yok.</p></div>`;
  } else {
    html += `<table class="entries"><thead><tr><th>Tarih</th><th>Toplam</th></tr></thead><tbody>`;
    rows.forEach(e=>{
      html += `<tr><td>${longLabel(e.date)}</td><td class="n">${totalOf(e)}</td></tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `</div>`;

  html += shellClose();
  document.getElementById('app').innerHTML = html;
  document.getElementById('back').onclick = ()=>{ state.view='teacher-list'; render(); };
  document.getElementById('change-pw').onclick = ()=>{
    const body = document.getElementById('pw-card-body');
    body.innerHTML = `
      <div class="field">
        <label>Kullanıcı Adı</label>
        <input type="text" id="f-new-user" value="${escapeHtml(student.username || suggestUsername(student.name))}" autocomplete="off" autocapitalize="off">
      </div>
      <div style="display:flex;gap:8px;">
        <div style="flex:1;"><input type="text" id="f-new-pw" value="${escapeHtml(student.password || generatePassword())}" autocomplete="off"></div>
        <button type="button" class="btn btn-outline" id="gen-new-pw" style="white-space:nowrap;">Otomatik</button>
      </div>
      <div id="cred-error" style="color:var(--red);font-size:13px;font-weight:600;min-height:16px;margin-top:6px;"></div>
      <button class="btn btn-red btn-block" id="save-new-pw" style="margin-top:4px;">Kaydet</button>`;
    document.getElementById('gen-new-pw').onclick = ()=>{ document.getElementById('f-new-pw').value = generatePassword(); };
    document.getElementById('save-new-pw').onclick = async ()=>{
      const newUser = document.getElementById('f-new-user').value.trim();
      const newPw = document.getElementById('f-new-pw').value.trim();
      if(!newUser || !newPw){ document.getElementById('cred-error').textContent = 'Kullanıcı adı ve şifre boş olamaz.'; return; }
      let duplicate = false;
      const ok = await withLatestData((students)=>{
        if(students.some(s=>s.id!==student.id && (s.username||'').toLowerCase()===newUser.toLowerCase())){ duplicate = true; return false; }
        const s = students.find(x=>x.id===student.id);
        if(s){ s.username = newUser; s.password = newPw; }
      });
      if(duplicate){ document.getElementById('cred-error').textContent = 'Bu kullanıcı adı başka bir öğrencide kayıtlı.'; return; }
      if(!ok) return;
      render();
    };
  };

  if(!targetLoading){
    document.getElementById('refresh-target').onclick = ()=>{
      state.targetLoadingFor = student.id;
      render();
    };
  }
  if(targetLoading && !targetFetchesInFlight.has(student.id)){
    targetFetchesInFlight.add(student.id);
    fetchTargetAndSave(student);
  }

  drawTrendChart(student.id);
  drawSubjectsChart(student);
}

async function fetchTargetAndSave(student){
  const result = await getGeminiTarget(student);
  targetFetchesInFlight.delete(student.id);
  state.targetLoadingFor = null;
  if(result){
    await withLatestData((students)=>{
      const s = students.find(x=>x.id===student.id);
      if(s){ s.dailyTarget = result.target; s.targetReason = result.reason; }
    });
  }
  if(state.view==='teacher-detail' && state.teacherStudentId===student.id){
    render();
  }
}

function trendRange(studentId){
  const today = todayStr();
  const floor = addDays(today, -29);
  const active = entriesFor(studentId).filter(e=>totalOf(e)>0).map(e=>e.date).sort();
  let start = floor;
  if(active.length>0 && active[0]>floor) start = active[0];
  const days = [];
  let d = start;
  while(d<=today){ days.push(d); d = addDays(d,1); }
  return days;
}
function drawTrendChart(studentId){
  const canvas = document.getElementById('chart-trend');
  if(!canvas) return;
  if(!window.Chart){ chartUnavailableNote(canvas); return; }
  const days = trendRange(studentId);
  const data = days.map(d=>sumForDate(studentId,d));
  if(charts.trend) charts.trend.destroy();
  charts.trend = new Chart(canvas.getContext('2d'), {
    type:'line',
    data:{ labels: days.map(shortLabel), datasets:[{ data, borderColor:'#C0392B', backgroundColor:'rgba(192,57,43,.08)', fill:true, tension:.3, pointRadius:0, borderWidth:2 }] },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label:(c)=>`${c.parsed.y} soru`}} },
      scales:{
        y:{ beginAtZero:true, ticks:{precision:0, font:{family:'IBM Plex Mono', size:10}}, grid:{color:'#E8EDF2'} },
        x:{ ticks:{font:{family:'Inter', size:10}, maxTicksLimit:8}, grid:{display:false} }
      }
    }
  });
}

function drawSubjectsChart(student){
  const canvas = document.getElementById('chart-subjects');
  if(!canvas) return;
  if(!window.Chart){ chartUnavailableNote(canvas); return; }
  const subjects = getSubjects(student);
  const totals = subjectTotals(student.id);
  const labels = subjects.map(s=>s.replace(' (TYT)','').replace(' (AYT)',''));
  const data = subjects.map(s=> totals[s]||0);
  if(charts.subjects) charts.subjects.destroy();
  if(labels.length===0) return;
  charts.subjects = new Chart(canvas.getContext('2d'), {
    type:'bar',
    data:{ labels, datasets:[{ data, backgroundColor: labels.map((_,i)=>PALETTE[i%PALETTE.length]), borderRadius:5 }] },
    options:{
      indexAxis:'y',
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label:(c)=>`${c.parsed.x} soru`}} },
      scales:{
        x:{ beginAtZero:true, ticks:{precision:0, font:{family:'IBM Plex Mono', size:10}}, grid:{color:'#E8EDF2'} },
        y:{ ticks:{font:{family:'Inter', size:11.5}}, grid:{display:false} }
      }
    }
  });
}

/* ---------------- init ---------------- */
loadAll().then(()=>{
  const h = location.hash.replace('#','').toLowerCase();
  if(h==='hoca' || h==='ogretmen' || h==='öğretmen'){
    state.view='teacher-pin'; render(); return;
  }
  const remembered = getRemembered();
  if(remembered && state.students.some(s=>s.id===remembered)){
    state.currentStudentId = remembered;
    state.view='student-entry';
  } else {
    if(remembered) clearRemembered();
    state.view='login';
  }
  render();
});
</script>
